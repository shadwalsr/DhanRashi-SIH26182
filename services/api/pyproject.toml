[project]
name = "vasp-trace-api"
version = "0.1.0"
description = "VASP-Trace: Automated Attribution of Unknown Cryptocurrency Wallets to Nearest VASPs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",

    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",

    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",

    "redis>=5.0.4",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.3",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "types-redis>=4.6.0.20240425",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]


[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

